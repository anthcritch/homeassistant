        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.dwell_lighting_ensuite_enabled

# Consolidated group for dashboard/status use.
group:
  dwell_motion_automation_controls:
    name: Motion Automation Controls
    icon: mdi:motion-sensor
    entities:
      - switch.kitchen_motion_automation
      - switch.dining_motion_automation
      - switch.lounge_motion_automation
      - switch.office_motion_automation
      - switch.main_bedroom_motion_automation
      - switch.ensuite_motion_automation
