        state: "{{ is_state('input_boolean.dwell_lighting_main_bedroom_enabled', 'on') }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.dwell_lighting_main_bedroom_enabled
        turn_off:
          - service: input_boolean.turn_off
            target:
