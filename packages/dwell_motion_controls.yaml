# Dwell room motion automation controls
# User-facing switches wrap the existing per-room Dwell lighting enable helpers.
# ON  = motion/presence automation may control that room.
# OFF = room lighting is manual.
#
# These switches do not directly change light state.
# Guest mode may turn the underlying room helper off for rooms that must remain manual.

template:
  - switch:
      - name: Kitchen Motion Automation
        unique_id: dwell_motion_kitchen
        icon: mdi:motion-sensor
        state: "{{ is_state('input_boolean.dwell_lighting_kitchen_enabled', 'on') }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.dwell_lighting_kitchen_enabled
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.dwell_lighting_kitchen_enabled

      - name: Dining Motion Automation
        unique_id: dwell_motion_dining
        icon: mdi:motion-sensor
        state: "{{ is_state('input_boolean.dwell_lighting_dining_enabled', 'on') }}"
